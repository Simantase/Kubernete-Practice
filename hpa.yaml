apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spring-boot-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spring-boot-k8s  # Points to your deployment to scale it
  minReplicas: 2          # Safely defaults to 2 pods minimum
  maxReplicas: 10         # Allows scaling up to 10 pods during heavy traffic
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scales up automatically if average CPU hits 70%